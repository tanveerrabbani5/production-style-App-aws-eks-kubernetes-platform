###----APPLICATION INGRESS

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: k8s-eks-app-ingress
  namespace: k8s-eks-app

  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

spec:
  ingressClassName: alb

  rules:
    - http:

        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: k8s-eks-app-backend

                port:
                  number: 80